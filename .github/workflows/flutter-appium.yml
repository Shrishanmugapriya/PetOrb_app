name: Flutter Appium 2.x E2E Automation Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  mobile-e2e-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Enable KVM group permissions for Android Emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Ensure Android Home & AVD directory exist
        run: |
          mkdir -p ~/.android
          mkdir -p e2e_framework/reports/html e2e_framework/reports/failures e2e_framework/reports/logs

      - name: Run Appium & Android Emulator E2E Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            echo "=== Android AVD initialized successfully ==="
            python -m pip install --upgrade pip
            if [ -f appium_test_suite/requirements.txt ]; then
              pip install -r appium_test_suite/requirements.txt
            fi
            if [ -f appium_test_suite/run_tests.py ]; then
              python appium_test_suite/run_tests.py
            fi

      - name: Upload E2E Test Artifacts & Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-e2e-test-reports
          path: |
            appium_test_suite/reports/
            e2e_framework/reports/
          if-no-files-found: ignore
